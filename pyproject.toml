[project]
name = "paper-formater"
version = "1.0.0"
description = "论文格式校验软件"
authors = [
    { name = "Author", email = "author@example.com" }
]
readme = "README.md"

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Software Development :: User Interfaces"
]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "SQLAlchemy>=2.0.23",
    "langchain>=0.1.10",
    "langchain-deepseek>=0.0.1",
    "pandas>=2.1.4",
    "matplotlib>=3.8.2",
    "PyPDF2>=3.0.1",
    "pdfplumber>=0.10.2",
    "python-docx>=0.8.11",
    "reportlab>=4.0.8",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pytest>=9.0.2"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy"
]
build = [
    "pyinstaller",
    "setuptools",
    "wheel"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

package-dir = { "" = "src" }

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]